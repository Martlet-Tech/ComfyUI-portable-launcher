<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ComfyUI Flauncher</title>
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <div id="app">
    <div id="topbar">
      <div class="topbar-left">
        <button id="settingsBtn" class="icon-btn" title="系统设置">&#9881;</button>
      </div>
      <div class="topbar-right">
        <button id="addBtn" class="icon-btn" title="添加实例">+</button>
        <button id="removeBtn" class="icon-btn" title="删除实例" disabled>&minus;</button>
      </div>
    </div>

    <div id="mainArea">
      <div id="instanceList">
        <div id="listEmpty" class="empty-hint">暂无实例，点 + 添加</div>
      </div>

      <div id="instanceDetail" class="hidden">
        <div class="detail-row">
          <input type="text" id="instanceAlias" placeholder="备注别名（可选）" />
          <span class="path-label" id="instancePath"></span>
        </div>

        <div class="detail-section">
          <div class="section-title">启动</div>
          <div class="btn-group">
            <button class="launch-btn" data-mode="cpu">CPU</button>
            <button class="launch-btn primary" data-mode="gpu">GPU</button>
            <button class="launch-btn" data-mode="gpu_fastfp16">GPU Fast FP16</button>
            <button class="stop-btn hidden">停止</button>
          </div>
        </div>

        <div class="detail-section">
          <div class="section-title">更新</div>
          <div class="btn-group">
            <button class="update-btn" data-type="latest">最新版</button>
            <button class="update-btn" data-type="stable">稳定版</button>
            <button class="update-btn" data-type="deps">依赖</button>
          </div>
        </div>

        <div class="detail-section">
          <div class="section-title">端口</div>
          <input type="number" id="instancePort" value="8188" class="port-input" />
        </div>

        <div class="detail-section">
          <div class="section-title">路径</div>
          <div id="pathRows"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="settingsModal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-body">
      <div class="modal-header">
        <span>系统设置</span>
        <button class="icon-btn modal-close">&times;</button>
      </div>
      <div class="modal-content">
        <div class="settings-section">
          <div class="section-title">网络代理</div>
          <label class="proxy-toggle">
            <input type="checkbox" id="settingsProxyToggle" />
            <span>启用系统代理 / 手动指定</span>
          </label>
          <div class="proxy-manual" id="settingsProxyManual" style="display:none">
            <input type="text" id="settingsProxyHost" placeholder="127.0.0.1" class="small-input" />
            <span>:</span>
            <input type="number" id="settingsProxyPort" placeholder="7890" class="small-input port-input" />
          </div>
        </div>
        <div class="settings-section">
          <div class="section-title">配置路径</div>
          <p><span id="configPathDisplay"></span></p>
        </div>
      </div>
    </div>
  </div>

  <div id="logModal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-body log-modal">
      <div class="modal-header">
        <span>日志输出</span>
        <button class="icon-btn modal-close">&times;</button>
      </div>
      <div class="modal-content">
        <pre id="logContent"></pre>
      </div>
    </div>
  </div>

  <div id="portConflictModal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-body conflict-modal">
      <div class="modal-header">
        <span>端口冲突</span>
        <button class="icon-btn modal-close">&times;</button>
      </div>
      <div class="modal-content">
        <p id="portConflictMsg"></p>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
