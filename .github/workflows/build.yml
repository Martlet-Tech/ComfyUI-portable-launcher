name: Build and Release
on:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend deps
        run: npm install
      - name: Build frontend
        run: npm run build
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Sync version and build
        shell: pwsh
        run: |
          $ver = (Get-Content src-tauri/Cargo.toml | Select-String '^version = "(.+)"$').Matches.Groups[1].Value
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.version = $ver
          $conf | ConvertTo-Json -Depth 32 | Set-Content src-tauri/tauri.conf.json
          npx tauri build
      - name: Pack zip
        shell: pwsh
        run: |
          $ver = (Get-Content src-tauri/Cargo.toml | Select-String '^version = "(.+)"$').Matches.Groups[1].Value
          $exeName = "comfyui-portable-launcher.exe"
          Compress-Archive -Path "src-tauri\target\release\$exeName" -DestinationPath "ComfyUI-portable-launcher-v$ver.zip"
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ComfyUI-portable-launcher-v*.zip
