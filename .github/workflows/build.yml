name: Build and Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend deps
        run: npm install
      - name: Build frontend
        run: npm run build
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Sync version and build
        shell: pwsh
        run: |
          $ver = (Get-Content src-tauri/Cargo.toml | Select-String '^version = "(.+)"$').Matches.Groups[1].Value
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.version = $ver
          $conf | ConvertTo-Json -Depth 32 | Set-Content src-tauri/tauri.conf.json
          npx tauri build
      - name: Pack zip
        shell: pwsh
        run: |
          $ver = (Get-Content src-tauri/Cargo.toml | Select-String '^version = "(.+)"$').Matches.Groups[1].Value
          $exeName = "comfyui-portable-launcher.exe"
          Compress-Archive -Path "src-tauri\target\release\$exeName" -DestinationPath "ComfyUI-portable-launcher-v$ver.zip"
      - name: Publish release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = (Get-Content src-tauri/Cargo.toml | Select-String '^version = "(.+)"$').Matches.Groups[1].Value
          $tag = "v$ver"
          $zip = (Get-Item "ComfyUI-portable-launcher-v$ver.zip").FullName
          gh release view $tag | Out-Null
          $exists = ($LASTEXITCODE -eq 0)
          for ($i = 1; $i -le 3; $i++) {
            if ($exists) { gh release upload $tag $zip --clobber }
            else { gh release create $tag $zip --notes-from-tag }
            if ($LASTEXITCODE -eq 0) {
              gh release edit $tag --draft=false
              Write-Host "published $zip -> $tag"
              exit 0
            }
            Write-Host "attempt $i failed (exit $LASTEXITCODE), retrying in 20s"
            Start-Sleep -Seconds 20
          }
          Write-Error "release publish failed after 3 attempts"
          exit 1
