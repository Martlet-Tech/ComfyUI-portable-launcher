[package]
name = "comfyui-portable-launcher"
version = "0.2.0"
edition = "2021"

[lib]
name = "comfyui_flauncher_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.52"
windows = { version = "0.61", features = ["Win32_System_SystemInformation", "Win32_System_ProcessStatus"] }
